<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IA — FirstStep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ia.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">First<span>Step</span></a>
    <nav id="main-nav">
      <a href="index.html">Início</a>
      <a href="ia.html" class="active">IA</a>
      <a href="teste-vocacional.html">Teste Vocacional</a>
      <a href="carreira.html">Carreira</a>
      <a href="humano.html">Des. Humano</a>
      <a href="dicas.html">Dicas</a>
      <a href="teste-vocacional.html" class="btn-nav">Fazer o Teste →</a>
    </nav>
    <div class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</header>

<div class="ai-hero">
  <div class="ai-hero-inner">
    <div class="section-tag" style="background:rgba(91,155,248,.2);color:#5B9BF8;">Assistente</div>
    <h1>IA do FirstStep</h1>
    <p>Tire dúvidas sobre carreira e desenvolvimento humano. Escreva sua pergunta abaixo.</p>
  </div>
</div>

<div class="container">
  <div class="ai-chat">
    <div class="ai-messages" id="aiMessages" aria-live="polite"></div>

    <form class="ai-form" id="aiForm" autocomplete="off">
      <input
        class="ai-input"
        id="aiInput"
        type="text"
        placeholder="Digite sua pergunta…"
        required
      />
      <button class="btn btn-primary" id="aiSend" type="submit">Enviar</button>
    </form>
    <div class="ai-hint" id="aiHint">Dica: pergunte “Qual carreira combina comigo?”</div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-bottom footer-bottom--single">
      <span>© 2026 FirstStep. Todos os direitos reservados.</span>
    </div>
  </div>
</footer>

<script src="js/navigation.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
